<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3eee3" />

    <!-- Fonts are discovered here rather than through an @import inside the
         stylesheet, which hid them behind a second round trip: HTML, then CSS,
         then the Google stylesheet, then the files. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Albert+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Albert+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap"
    />
    <!-- The hero paints this still before the first takeoff frames decode. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <title>PIA — Great People to Fly With</title>
    <meta
      name="description"
      content="Pakistan International Airlines — the national flag carrier. Book flights from Karachi, Lahore and Islamabad across Pakistan, the Gulf, Asia, Europe and North America."
    />
    <link rel="canonical" href="https://pia-nine-delta.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pakistan International Airlines" />
    <meta property="og:url" content="https://pia-nine-delta.vercel.app/" />
    <meta property="og:title" content="PIA — Great People to Fly With" />
    <meta
      property="og:description"
      content="Flights from Karachi, Lahore and Islamabad to 50 destinations worldwide."
    />
    <meta property="og:image" content="https://pia-nine-delta.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A PIA Boeing 777 rotating off a wet runway at dawn." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pia-nine-delta.vercel.app/og.jpg" />
  </head>
  <body>
    <!--
    THESIS: The booking hall as a Mughal marble court. The page is ivory stone
    structured by inlaid cartouche borders and pierced jali screens; it refuses
    the dark-glass photo-hero airline default and its white-minimal opposite.
    OWN-WORLD: ivory marble ground, deep green ink, PIA emerald owning whole
    regions (hero surround, departures tablet, footer), official gold as
    engraved double-rule inlay, cusped-arch clip on feature frames, low-contrast
    jali lattice fields, Marcellus inscriptional display, Albert Sans body,
    Spline Sans Mono for ticket data.
    STORY: a passenger meets the flag carrier's own architecture and reaches a
    fare and a date inside one screen.
    FIRST VIEWPORT: the takeoff film full-bleed behind an inset gold inlay
    frame, title in Marcellus, the booking widget as an ivory cartouche over
    the film's lower third - the primary action.
    FORM: Mughal jali and pietra dura, candidate 1 of 7, seed 685cda0f.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, DESIGN.md, and every shipping raster carrying
    its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
